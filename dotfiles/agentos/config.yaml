data_dir: ~/Library/Mobile Documents/com~apple~CloudDocs/Documents/agentos
keep_mac_awake: true
app_text_scale: 0.92
agent_command: claude
projects:
  - name: livedocument
    directory: /Users/nednella/code/upscope/livedocument
    pr_checks_command: "fix the failing checks on PR #{n} and push; never merge, mark ready or request reviewers"
    pr_conflict_command: "PR #{n} conflicts with master: rebase onto origin/master, never merge master in; resolve the conflicts, run the tests and push with --force-with-lease; never merge, mark ready or request reviewers"
    pr_review_command: "address the review on PR #{n}: fix what it asks, resolve the threads you fixed and push; never merge, mark ready or request reviewers"
    queue_sections:
      - name: Ready
        labels: [ready]
        draggable_from: []
        actions:
          - { name: Work, command: "/work {n}" }
      - name: Needs you
        labels: [needs-human]
        draggable_from: []
        actions:
          - { name: Work with me, command: "/work {n} manual" }
      - name: Ideas
        labels: [idea]
        actions:
          - { name: Open }
      - name: Roadmap
        labels: [roadmap]
        actions:
          - { name: Plan, command: "/plan {n}", model: fable, effort: high }
    session_branch_fallback: issue-{n}
    session_cleanup_command: upscope worktree remove {branch}; git branch -D {branch}
    session_cleanup_mode:
      close: auto
      merge: auto
  - name: agentos
    directory: /Users/nednella/code/agentos
    pr_checks_command: "fix the failing checks on PR #{n} and push; never merge, mark ready or request reviewers"
    pr_conflict_command: "PR #{n} conflicts with main: rebase onto origin/main, never merge main in; resolve the conflicts, run the tests and push with --force-with-lease; never merge, mark ready or request reviewers"
    pr_review_command: "address the review on PR #{n}: fix what it asks and push; never merge, mark ready or request reviewers"
    queue_sections:
      - name: Inbox
        labels: ["*"]
        actions:
          - { name: Work, command: "/work {n}" }
    session_branch_fallback: issue-{n}
    session_cleanup_command: git worktree remove {worktree} && git branch -D {branch}
    session_cleanup_mode:
      close: auto
      merge: auto
  - name: sanity
    directory: /Users/nednella/code/sanity
    pr_checks_command: "fix the failing checks on PR #{n} and push; never merge, mark ready or request reviewers"
    pr_conflict_command: "PR #{n} conflicts with main: rebase onto origin/main, never merge main in; resolve the conflicts, run the tests and push with --force-with-lease; never merge, mark ready or request reviewers"
    pr_review_command: "address the review on PR #{n}: fix what it asks and push; never merge, mark ready or request reviewers"
    queue_sections:
      - name: Inbox
        labels: ["*"]
        actions:
          - { name: Work, command: "/work {n}" }
    session_branch_fallback: issue-{n}
    session_cleanup_command: git worktree remove {worktree} && git branch -D {branch}
    session_cleanup_mode:
      close: auto
      merge: auto
